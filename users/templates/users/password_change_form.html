{% extends "onlinecourse/base.html" %}

{% load static %}
{% block content %}

<div class="password-change-page">
    <div class="password-change-inner">
        <div class="password-change">
            <div class="password-change-title">
                <img src="{% static 'images/change-password-logo.jpg' %}" alt="{{ user.username }}" class="user-avatar">
                <h2 style="color: #555050">Смена пароля</h2>
            </div>
            <form method="post" class="password-change-form">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="password-change-btn-row">
                    <button type="submit" class="password-change-btn">Изменить пароль</button>
                    <button type="submit" class="password-change-btn-remove">Отмено</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
